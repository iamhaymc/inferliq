
[project]
name = "inferliq"
version = "0.1.0"
description = "fast and tiny inference"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

dependencies = [
    "python-dotenv",
    "omegaconf",
    "lighteval>=0.13.0",
    "langdetect>=1.0.9",
    "ipykernel"
]

[project.optional-dependencies]
reference = [
    "torch>=2.0",
    "transformers>=4.54.0",
    "safetensors",
    "numpy>=2",
    "tokenizers",
]
tune = [
    "peft",
    "datasets",
    "accelerate",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
